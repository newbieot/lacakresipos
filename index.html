<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="robots" content="noindex, nofollow">
    
    <title>Bulk Lacak PosIND - Mitra by Ikhsan Radiansyah</title>
    <link rel="icon" type="image/png" href="favicon-lacakresipos.png">
    
    <!-- Penambahan Tipografi Resmi PosIND: Sora (Headline) & Gantari (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gantari:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Warna Resmi PosIND */
            --delft-blue: #1C2D5A;
            --cinnabar: #EF4123;
            --white: #FFFFFF;
            --gray-light: #F4F6F9;
            --text-dark: #333333;
        }

        body {
            /* Menggunakan Gantari untuk Body Text sesuai guideline */
            font-family: 'Gantari', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--gray-light);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
        }

        .container {
            background-color: var(--white);
            width: 100%;
            max-width: 650px;
            padding: 40px;
            margin: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(28, 45, 90, 0.10);
            text-align: center;
            position: relative;
            overflow: hidden;
            height: fit-content;
        }

        /* Hiasan atas */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, var(--cinnabar) 30%, var(--delft-blue) 30%);
        }

        /* LOGO AREA (Danantara Kiri & PosIND Kanan) */
        .header-logos {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 1px solid #E2E8F0;
        }

        .logo-danantara {
            height: 32px;
            object-fit: contain;
        }

        .logo-posind {
            height: 38px;
            object-fit: contain;
        }

        /* Menggunakan Sora untuk Headline */
        h1 {
            font-family: 'Sora', sans-serif;
            font-size: 24px;
            color: var(--delft-blue);
            margin-bottom: 25px;
            font-weight: 700;
        }

        /* Form Area */
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            font-family: 'Sora', sans-serif;
            font-size: 15px;
            color: var(--delft-blue);
            font-weight: 700;
            margin-bottom: 12px;
            display: block;
        }

        /* TEXTAREA untuk Multi Input */
        textarea {
            width: 100%;
            padding: 16px;
            font-size: 15px;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            box-sizing: border-box;
            font-family: 'Gantari', sans-serif;
            color: var(--delft-blue);
            font-weight: 500;
            min-height: 160px;
            resize: vertical;
            line-height: 1.6;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--delft-blue);
            background-color: #F8FAFF;
            box-shadow: 0 0 0 3px rgba(28, 45, 90, 0.1);
        }

        .helper-text {
            font-size: 13px;
            color: #64748B;
            margin-top: 8px;
            font-weight: 500;
        }

        /* Tombol - Menggunakan Sora Bold */
        button {
            width: 100%;
            background-color: var(--cinnabar);
            color: var(--white);
            border: none;
            padding: 18px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Sora', sans-serif;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(239, 65, 35, 0.25);
        }

        button:hover {
            background-color: #d13215;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 65, 35, 0.35);
        }

        /* Area Hasil (List) */
        #result-area {
            margin-top: 35px;
            display: none;
        }

        .result-header {
            text-align: left;
            font-family: 'Sora', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--delft-blue);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #F1F5F9;
        }

        /* Kartu per Resi */
        .result-card {
            background-color: #F8FAFF;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            text-align: left;
            transition: all 0.2s ease;
        }

        .result-card:hover {
            border-color: #CBD5E1;
            background-color: #F1F5F9;
        }

        .resi-number {
            font-family: 'Sora', sans-serif;
            font-size: 17px;
            font-weight: 700;
            color: var(--delft-blue);
            letter-spacing: 0.5px;
        }

        .resi-link-btn {
            background-color: var(--delft-blue);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-family: 'Sora', sans-serif;
            font-weight: 600;
            display: inline-block;
            transition: opacity 0.2s;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        .resi-link-btn:hover {
            opacity: 0.9;
        }
        
        @media (min-width: 480px) {
            .result-card {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
            .resi-link-btn {
                width: auto;
            }
        }

        /* Modern SaaS Footer (SLIM, DARK & FULL-WIDTH) */
        .modern-footer {
            width: 100%; 
            box-sizing: border-box; 
            margin-top: auto; /* Memastikan footer selalu di bawah */
            padding: 2rem 1rem 1.5rem 1rem; 
            background-color: #0f172a; 
            border-top: 4px solid var(--cinnabar); 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem; 
            font-family: 'Gantari', sans-serif;
        }
        .footer-brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #f8fafc; 
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }
        .footer-desc {
            color: #94a3b8; 
            font-size: 0.85rem;
            text-align: center;
            max-width: 500px;
            line-height: 1.5;
            margin: 0;
        }
        .footer-creator-badge {
            margin-top: 0.5rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 65, 35, 0.1); /* Menggunakan Cinnabar */
            border: 1px solid rgba(239, 65, 35, 0.2);
            padding: 6px 16px; 
            border-radius: 30px;
            color: #e2e8f0;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }
        .footer-creator-badge:hover {
            background: rgba(239, 65, 35, 0.2);
            border-color: rgba(239, 65, 35, 0.5);
            box-shadow: 0 0 10px rgba(239, 65, 35, 0.2);
            transform: translateY(-2px);
        }
        .footer-creator-badge strong {
            color: var(--cinnabar);
            font-weight: 600;
            letter-spacing: 0.3px;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar"></div>

        <!-- LOGO HEADER AREA -->
        <div class="header-logos">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Danantara_Indonesia.svg/960px-Danantara_Indonesia.svg.png?_=20250304063014" alt="Danantara Logo" class="logo-danantara">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/POSIND_2023.svg/330px-POSIND_2023.svg.png" alt="PosIND Logo" class="logo-posind">
        </div>

        <h1>Bulk Tracking Antaran</h1>

        <div class="form-group">
            <label for="resiInput">Masukkan Nomor Resi (Satu per baris):</label>
            <textarea id="resiInput" placeholder="P2601080046258&#10;P2601080099999&#10;P2601080088888"></textarea>
            <div class="helper-text">*Pisahkan setiap nomor resi dengan menekan tombol Enter.</div>
        </div>

        <button onclick="generateBulkLinks()">PROSES SEMUA RESI</button>

        <div id="result-area">
            <div class="result-header">Hasil Pencarian:</div>
            <div id="cards-container">
                <!-- Hasil resi akan muncul di sini -->
            </div>
        </div>
    </div> <!-- Penutup Container -->

    <script>
        function generateBulkLinks() {
            var rawInput = document.getElementById("resiInput").value;
            
            if (rawInput.trim() === "") {
                alert("Mohon masukkan minimal satu nomor resi.");
                return;
            }

            var resiList = rawInput.split(/\r?\n/);
            
            var container = document.getElementById("cards-container");
            var resultArea = document.getElementById("result-area");
            
            container.innerHTML = "";
            
            var count = 0;

            resiList.forEach(function(resi) {
                var cleanResi = resi.trim();

                if (cleanResi !== "") {
                    count++;
                    
                    var finalUrl = "https://kibananew.posindonesia.co.id:4433/x123449/xhdhhdencript12092003posaja.php?id=" + cleanResi;

                    var cardHtml = `
                        <div class="result-card">
                            <div class="resi-number">#${cleanResi}</div>
                            <a href="${finalUrl}" target="_blank" class="resi-link-btn">
                                LIHAT LOKASI & FOTO
                            </a>
                        </div>
                    `;
                    
                    container.innerHTML += cardHtml;
                }
            });

            if (count > 0) {
                resultArea.style.display = "block";
            } else {
                alert("Tidak ada nomor resi yang valid ditemukan.");
            }
        }
    </script>

    <!-- FOOTER AREA MEMANJANG PENUH -->
    <footer class="modern-footer">
        <div class="footer-brand">
            <i data-lucide="layers" style="color: #EF4123; width: 20px; height: 20px;"></i>
            PosNew Hub
        </div>
        <p class="footer-desc">
            Sistem utilitas ini dikembangkan secara independen untuk optimalisasi efisiensi layanan logistik B2B dan Ritel.
        </p>
        <div class="footer-creator-badge">
            <i data-lucide="code-2" style="color: #EF4123; width: 14px; height: 14px;"></i>
            Inovasi oleh <strong>Ikhsan Radiansyah</strong> &copy; 2026
        </div>
    </footer>

    <!-- Lucide Icons Script -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>

</body>
</html>
